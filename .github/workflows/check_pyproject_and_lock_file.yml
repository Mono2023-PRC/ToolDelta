name: Check PyProject and Lock File



on:
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch: {}



jobs:
  Checker:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lock and Check
        run: |
            uv lock
      - name: Submit Changes
        uses: EndBug/add-and-commit@v9
        with:
          default_author: github_actions
          message: "[AUTO] Lock uv Files"
          add: "uv.lock"
