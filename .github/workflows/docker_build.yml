name: Build and Push Docker Image

on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - dev
      - main
  workflow_run:
    workflows: ["Sync Version"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: 'Additional tag suffix (e.g., stable, dev)'
        required: false
        default: ''

env:
  REGISTRY: crpi-e9hja05da2ka9shc.cn-guangzhou.personal.cr.aliyuncs.com
  IMAGE_NAME: tooldelta_1/tooldelta-tui

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Alibaba Cloud Registry credentials
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DOCKER_USERNAME: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.ALIYUN_DOCKER_PASSWORD || secrets.ALIYUN_DOCKER_PASSWD }}
        run: |
          if [ -z "$DOCKER_USERNAME" ] || [ -z "$DOCKER_PASSWORD" ]; then
            echo "::error::Missing Alibaba Cloud Registry credentials. Set ALIYUN_DOCKER_USERNAME and ALIYUN_DOCKER_PASSWORD in repository Actions secrets."
            exit 1
          fi

      - name: Login to Alibaba Cloud Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD || secrets.ALIYUN_DOCKER_PASSWD }}

      - name: Get Version from file
        id: version_file
        run: |
          VERSION=$(cat version)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_ENV

      - name: Determine tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.version_file.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
