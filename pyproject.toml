[project]
name = "Tooldelta"
version = "0.0.0"                                              # This field is automatically set to the value in the version file
description = "Plugin Loader for NeteaseRentalServer on Panel"
authors = [{ name = "ToolDelta Studio Staff" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Please don't change this manually, your changes may invalidate other people's package management, use uv to make changes!
dependencies = [
    "colorama>=0.4.6,<0.5.0",
    "pyspeedtest==1.2.7",
    "aiohttp>=3.14.3,<4.0.0",
    "flask>=3.1.3,<4.0.0",
    "websocket-client>=1.7.0,<2.0.0",
    "pyyaml==6.0.1",
    "brotli>=1.2.0,<2.0.0",
    "websockets>=12.0,<13.0",
    "tqdm>=4.66.4,<5.0.0",
    "anyio>=4.4.0,<5.0.0",
    "requests>=2.33.0,<3.0.0",
    "numpy>=2.1.0,<3.0.0",
    "protobuf>=6.33.5,<7.0.0",
    "grpcio>=1.83.0,<2.0.0",
    "msgpack>=1.2.1,<2.0.0",
    "nbtlib>=2.0.4,<3.0.0",
    "rich>=14.1.0,<15.0.0",
]

[project.urls]
Homepage = "https://github.com/ToolDelta-Basic/ToolDelta"
Repository = "https://github.com/ToolDelta-Basic/ToolDelta"

[[tool.uv.index]]
name = "mirrors"
url = "http://mirrors.aliyun.com/pypi/simple/"
default = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tooldelta"]

[tool.hatch.build.targets.sdist]
only-include = ["tooldelta", "README.md", "LICENSE"]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "W",     # pycodestyle warnings
    "E",     # pycodestyle errors
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "T10",   # flake8-debugger
    "PYI",   # flake8-pyi
    "PT",    # flake8-pytest-style
    "Q",     # flake8-quotes
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "E501",   # line-too-long
    "UP037",  # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]

[tool.pyright]
typeCheckingMode = "basic"
